name: sprint3_demand_pulse
sprint: 3
description: >
  Demand Pulse classifies the demand trend per cluster from a monthly volume
  series with Mann-Kendall (direction and significance), Theil-Sen (slope),
  momentum, and optional STL seasonal strength. The canonical state has volume
  only, so the series is an optional second input; without it every cluster is
  unknown and only a marker-derived seasonal flag is set. It fills the
  demand_pulse slot and leaves the rest of run.json untouched.
inputs:
  - assets/samples/
  - assets/series/sample_series.csv
command: >
  python scripts/querymantic_run.py run --inputs assets/samples/ --output run.json
  --modules demand_pulse --series assets/series/sample_series.csv
expect:
  - run.json validates against the run-state contract
  - querymantic.modules_run is ["demand_pulse"]
  - modules.demand_pulse has params, stats_backend, series, summary, method_note, clusters
  - without a series every cluster state is unknown and trend is null
  - with the sample series at least one cluster leaves unknown and carries a trend block
  - a rising series yields state rising with a positive Theil-Sen slope
  - a flat series yields state flat
  - an all-tie series has no defined Mann-Kendall p-value and is never significant
  - the STL path reports itself unavailable when statsmodels is absent and degrades cleanly
  - seasonal_marker is derived from engine markers, kept separate from the series state
  - two runs on the same input produce an identical demand_pulse block
