name: Publish Check

# Runs on every push and pull request to main. Fails the build if a check fails,
# so broken code or committed secrets never reach the published branch.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to the commit SHA (v4, resolved 2026-06-09) so a re-tagged release
        # cannot change CI behaviour; Dependabot bumps the SHA with a clean PR.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0   # gitleaks needs the full history

      - name: Setup Python
        # Pinned to the commit SHA (v5, resolved 2026-06-09).
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup Node
        # Pinned to the commit SHA (v4, resolved 2026-06-09).
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit pip-audit pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Pre-commit checks (secrets, lint, bandit)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Dependency audit
        run: |
          # The core suite is stdlib-only, so there is no requirements.txt. The
          # optional libraries (Output Forge formats, STL seasonal path) are
          # pinned in requirements-optional.txt and that pinned set is what gets
          # audited here.
          if [ -f requirements-optional.txt ]; then
            pip-audit -r requirements-optional.txt
          else
            echo "No requirements-optional.txt: skipping pip-audit. The suite is stdlib-only."
          fi

      - name: Tests
        run: |
          if [ -d evals ] || [ -d tests ]; then
            pytest -q
          else
            echo "No tests found: skipping pytest."
          fi

      # Plugin structure is validated authoritatively by `claude plugin validate`,
      # run locally in scripts/publish.ps1 (it needs the Claude CLI login). An earlier
      # CI step ran `npx --yes github:...`, which fetched and executed third-party code
      # from a branch tip; it was removed because the local check is authoritative and
      # the npx step added a supply-chain surface for no extra guarantee.
