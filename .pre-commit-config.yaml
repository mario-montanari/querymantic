# Pin the hook versions here. To refresh: run `pre-commit autoupdate` once inside
# the repo, then `pre-commit install`.

# The vendored engine is read-only and kept byte-identical to its source, runs/
# holds generated output, and vendor/ holds pinned third-party assets (the
# plotly.js bundle) that must stay byte-identical so their recorded SHA-256 holds.
# No hook (ruff --fix, bandit, the formatters, the whitespace fixers, the
# large-file guard) may touch any of them, so all three are excluded below.
exclude: '^(engine/|runs/|vendor/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-ll"]
