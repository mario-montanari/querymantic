name: Publish Check

# Runs on every push and pull request to main. Fails the build if a check fails,
# so broken code or committed secrets never reach the published branch.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    # Secret, lint, and dependency checks. These do not depend on the Python version,
    # so they run once rather than per matrix leg.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to the commit SHA (v6.0.3, on Node 24, resolved 2026-06-10) so a
        # re-tagged release cannot change CI behaviour; Dependabot bumps the SHA.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0   # full history, so the gitleaks hook can scan every file

      - name: Setup Python
        # Pinned to the commit SHA (v6.2.0, on Node 24, resolved 2026-06-10).
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit pip-audit

      - name: Pre-commit checks (gitleaks full ruleset, lint, bandit)
        # gitleaks runs here as a pinned pre-commit hook (v8.21.2) with its full
        # ruleset over every tracked file, not a reduced known-pattern grep.
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Dependency audit
        run: |
          # The core suite is stdlib-only, so there is no requirements.txt. The
          # optional libraries (Output Forge formats, STL seasonal path) are pinned
          # in requirements-optional.txt and that pinned set is what gets audited.
          if [ -f requirements-optional.txt ]; then
            pip-audit -r requirements-optional.txt
          else
            echo "No requirements-optional.txt: skipping pip-audit. The suite is stdlib-only."
          fi

      - name: Validate plugin manifest (claude plugin validate)
        # The Claude Code CLI validates the plugin structure (.claude-plugin/plugin.json
        # and the manifest schema) offline, with no login and no API key. It is pinned to
        # an exact version so a re-published CLI cannot silently change CI behaviour. The
        # same check stays a fail-closed gate in scripts/publish.ps1 for local publishes.
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.167
          claude plugin validate .

  test:
    # The suite runs on every supported Python WITH the optional Office and stats
    # backends installed, so the real OOXML and STL paths are exercised (not skipped)
    # and a regression like the timestamp parse that differed between Python versions
    # is caught on the version where it bites.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools and optional backends
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Install the pinned optional backends so the xlsx/docx/pptx renderers and
          # the statsmodels STL path run for real on this Python, instead of skipping.
          if [ -f requirements-optional.txt ]; then
            pip install -r requirements-optional.txt
          fi

      - name: Tests
        run: |
          if [ -d evals ] || [ -d tests ]; then
            pytest -q
          else
            echo "No tests found: skipping pytest."
          fi

      # Plugin structure is validated by `claude plugin validate` in the lint job above
      # (pinned first-party CLI, offline, no login) and also stays a fail-closed gate in
      # scripts/publish.ps1 for local publishes. An earlier CI step ran
      # `npx --yes github:...`, which fetched and executed third-party code from a branch
      # tip; that was removed, and the pinned CLI replaces it without the branch-tip
      # supply-chain surface.
